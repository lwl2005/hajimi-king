{% extends "base.html" %}

{% block title %}登录 - Hajimi King{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header text-center">
                <h4 class="mb-0">
                    <i class="bi bi-shield-lock"></i> 访问验证
                </h4>
            </div>
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-crown-fill" style="font-size: 3rem; color: #667eea;"></i>
                    <h5 class="mt-2">Hajimi King</h5>
                    <p class="text-muted">请输入访问密码</p>
                </div>
                
                <form method="POST">
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-key"></i> 密码
                        </label>
                        <input type="password" 
                               class="form-control" 
                               id="password" 
                               name="password" 
                               placeholder="请输入访问密码"
                               required
                               autofocus>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-box-arrow-in-right"></i> 登录
                        </button>
                    </div>
                </form>
                
                <div class="mt-4 text-center">
                    <small class="text-muted">
                        <i class="bi bi-info-circle"></i> 
                        默认密码: hajimi123<br>
                        可通过环境变量 WEB_PASSWORD 修改
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 登录页面特效
    document.addEventListener('DOMContentLoaded', function() {
        const card = document.querySelector('.card');
        card.style.opacity = '0';
        card.style.transform = 'translateY(20px)';
        
        setTimeout(() => {
            card.style.transition = 'all 0.5s ease';
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
        }, 100);
    });
</script>
{% endblock %}
