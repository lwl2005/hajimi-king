{% extends "base.html" %}

{% block title %}实时日志 - Hajimi King{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
                <i class="bi bi-file-text-fill"></i> 实时日志
            </h2>
            <div>
                <button class="btn btn-outline-primary me-2" onclick="refreshLogs()">
                    <i class="bi bi-arrow-clockwise"></i> 刷新
                </button>
                <button class="btn btn-outline-secondary me-2" onclick="clearLogs()">
                    <i class="bi bi-trash"></i> 清空
                </button>
                <button class="btn btn-success" onclick="downloadLogs()">
                    <i class="bi bi-download"></i> 下载
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 日志控制面板 -->
<div class="row mb-4">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3">
                        <label for="log-type" class="form-label">日志类型</label>
                        <select class="form-select" id="log-type" onchange="loadLogs()">
                            <option value="scan">扫描日志</option>
                            <option value="error">错误日志</option>
                            <option value="system">系统日志</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="log-lines" class="form-label">显示行数</label>
                        <select class="form-select" id="log-lines" onchange="loadLogs()">
                            <option value="50">最近50行</option>
                            <option value="100" selected>最近100行</option>
                            <option value="200">最近200行</option>
                            <option value="500">最近500行</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="auto-refresh" class="form-label">自动刷新</label>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" id="auto-refresh" onchange="toggleAutoRefresh()">
                            <label class="form-check-label" for="auto-refresh">
                                启用 (5秒)
                            </label>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label for="log-filter" class="form-label">过滤关键词</label>
                        <input type="text" class="form-control" id="log-filter" placeholder="输入关键词过滤..." onkeyup="filterLogs()">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 日志统计 -->
<div class="row mb-4">
    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body">
                <i class="bi bi-file-earmark-text text-primary" style="font-size: 2rem;"></i>
                <h6 class="card-title mt-2">总日志行数</h6>
                <h4 class="text-primary" id="total-lines">-</h4>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body">
                <i class="bi bi-eye text-info" style="font-size: 2rem;"></i>
                <h6 class="card-title mt-2">当前显示</h6>
                <h4 class="text-info" id="visible-lines">-</h4>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body">
                <i class="bi bi-clock text-warning" style="font-size: 2rem;"></i>
                <h6 class="card-title mt-2">最后更新</h6>
                <h6 class="text-warning" id="last-update">-</h6>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body">
                <i class="bi bi-activity text-success" style="font-size: 2rem;"></i>
                <h6 class="card-title mt-2">状态</h6>
                <h6 class="text-success" id="log-status">正常</h6>
            </div>
        </div>
    </div>
</div>

<!-- 日志内容 -->
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="bi bi-terminal"></i> 日志内容
                    <span class="badge bg-primary ms-2" id="log-count">0</span>
                </h5>
            </div>
            <div class="card-body p-0">
                <div id="loading-spinner" class="text-center py-4" style="display: none;">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-2">正在加载日志数据...</p>
                </div>
                
                <div id="logs-container" style="height: 500px; overflow-y: auto; background: #1e1e1e; color: #fff; font-family: 'Courier New', monospace; font-size: 14px;">
                    <!-- 日志内容将在这里显示 -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 日志搜索结果模态框 -->
<div class="modal fade" id="searchModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-search"></i> 搜索结果
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="search-results">
                    <!-- 搜索结果将在这里显示 -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let autoRefreshInterval = null;
let allLogs = [];
let filteredLogs = [];

// 页面加载时初始化
document.addEventListener('DOMContentLoaded', function() {
    loadLogs();
});

// 加载日志
function loadLogs() {
    const logType = document.getElementById('log-type').value;
    const lines = document.getElementById('log-lines').value;
    
    // 显示加载动画
    document.getElementById('loading-spinner').style.display = 'block';
    
    const params = new URLSearchParams({
        type: logType,
        lines: lines
    });
    
    fetch(`/api/logs?${params}`)
        .then(response => response.json())
        .then(data => {
            allLogs = data.logs || [];
            filteredLogs = [...allLogs];
            displayLogs();
            updateStatistics(data);
        })
        .catch(error => {
            console.error('加载日志失败:', error);
            showAlert('danger', '加载日志失败: ' + error.message);
        })
        .finally(() => {
            document.getElementById('loading-spinner').style.display = 'none';
        });
}

// 显示日志
function displayLogs() {
    const container = document.getElementById('logs-container');
    
    if (filteredLogs.length === 0) {
        container.innerHTML = `
            <div class="text-center py-5" style="color: #ccc;">
                <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                <h5 class="mt-3">暂无日志数据</h5>
                <p>请等待系统生成日志或检查配置</p>
            </div>
        `;
        return;
    }
    
    let html = '<div class="p-3">';
    
    filteredLogs.forEach((log, index) => {
        const timestamp = new Date(log.timestamp).toLocaleString('zh-CN');
        const levelClass = getLevelClass(log.level);
        const levelIcon = getLevelIcon(log.level);
        
        html += `
            <div class="log-line mb-1" style="border-left: 3px solid ${levelClass}; padding-left: 10px;">
                <span style="color: #888; font-size: 12px;">[${timestamp}]</span>
                <span style="color: ${levelClass};">${levelIcon} ${log.level}</span>
                <span style="color: #fff; margin-left: 10px;">${escapeHtml(log.message)}</span>
            </div>
        `;
    });
    
    html += '</div>';
    container.innerHTML = html;
    
    // 滚动到底部
    container.scrollTop = container.scrollHeight;
    
    // 更新计数
    document.getElementById('log-count').textContent = filteredLogs.length;
}

// 更新统计信息
function updateStatistics(data) {
    document.getElementById('total-lines').textContent = data.total_lines || 0;
    document.getElementById('visible-lines').textContent = filteredLogs.length;
    document.getElementById('last-update').textContent = new Date().toLocaleTimeString('zh-CN');
    
    // 更新状态
    const status = data.error ? '错误' : '正常';
    const statusColor = data.error ? 'text-danger' : 'text-success';
    const statusElement = document.getElementById('log-status');
    statusElement.textContent = status;
    statusElement.className = statusColor;
}

// 获取日志级别颜色
function getLevelClass(level) {
    switch (level.toUpperCase()) {
        case 'ERROR':
            return '#ff6b6b';
        case 'WARNING':
        case 'WARN':
            return '#feca57';
        case 'INFO':
            return '#48dbfb';
        case 'DEBUG':
            return '#ff9ff3';
        default:
            return '#ddd';
    }
}

// 获取日志级别图标
function getLevelIcon(level) {
    switch (level.toUpperCase()) {
        case 'ERROR':
            return '❌';
        case 'WARNING':
        case 'WARN':
            return '⚠️';
        case 'INFO':
            return 'ℹ️';
        case 'DEBUG':
            return '🐛';
        default:
            return '📝';
    }
}

// 过滤日志
function filterLogs() {
    const filter = document.getElementById('log-filter').value.toLowerCase();
    
    if (!filter) {
        filteredLogs = [...allLogs];
    } else {
        filteredLogs = allLogs.filter(log => 
            log.message.toLowerCase().includes(filter) ||
            log.level.toLowerCase().includes(filter)
        );
    }
    
    displayLogs();
}

// 切换自动刷新
function toggleAutoRefresh() {
    const autoRefresh = document.getElementById('auto-refresh').checked;
    
    if (autoRefresh) {
        autoRefreshInterval = setInterval(() => {
            loadLogs();
        }, 5000);
        showAlert('info', '已启用自动刷新 (5秒间隔)');
    } else {
        if (autoRefreshInterval) {
            clearInterval(autoRefreshInterval);
            autoRefreshInterval = null;
        }
        showAlert('info', '已关闭自动刷新');
    }
}

// 刷新日志
function refreshLogs() {
    loadLogs();
    showAlert('success', '日志已刷新');
}

// 清空日志显示
function clearLogs() {
    document.getElementById('logs-container').innerHTML = `
        <div class="text-center py-5" style="color: #ccc;">
            <i class="bi bi-trash" style="font-size: 3rem;"></i>
            <h5 class="mt-3">日志已清空</h5>
            <p>点击刷新按钮重新加载日志</p>
        </div>
    `;
    document.getElementById('log-count').textContent = '0';
    showAlert('info', '显示内容已清空');
}

// 下载日志
function downloadLogs() {
    const logType = document.getElementById('log-type').value;
    const timestamp = new Date().toISOString().split('T')[0];
    
    let content = `# Hajimi King 日志导出\n`;
    content += `# 类型: ${logType}\n`;
    content += `# 导出时间: ${new Date().toLocaleString('zh-CN')}\n`;
    content += `# 总行数: ${filteredLogs.length}\n\n`;
    
    filteredLogs.forEach(log => {
        const timestamp = new Date(log.timestamp).toLocaleString('zh-CN');
        content += `[${timestamp}] ${log.level}: ${log.message}\n`;
    });
    
    // 创建下载链接
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `hajimi_logs_${logType}_${timestamp}.txt`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    
    showAlert('success', '日志文件下载已开始');
}

// HTML转义
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// 显示提示消息
function showAlert(type, message) {
    const alertHtml = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            <i class="bi bi-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-triangle' : 'info-circle'}"></i>
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    `;
    
    const container = document.querySelector('.container');
    const firstChild = container.firstElementChild;
    const alertDiv = document.createElement('div');
    alertDiv.innerHTML = alertHtml;
    container.insertBefore(alertDiv.firstElementChild, firstChild);
    
    // 5秒后自动隐藏
    setTimeout(() => {
        const alert = document.querySelector('.alert');
        if (alert) {
            const bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        }
    }, 5000);
}

// 页面卸载时清理定时器
window.addEventListener('beforeunload', function() {
    if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
    }
});
</script>
{% endblock %}
