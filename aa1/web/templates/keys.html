{% extends "base.html" %}

{% block title %}密钥管理 - Hajimi King{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
                <i class="bi bi-key-fill"></i> 密钥管理
            </h2>
            <div>
                <button class="btn btn-outline-primary me-2" onclick="refreshKeys()">
                    <i class="bi bi-arrow-clockwise"></i> 刷新
                </button>
                <div class="btn-group">
                    <button class="btn btn-success dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-download"></i> 导出
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#" onclick="exportKeys('txt')">TXT格式</a></li>
                        <li><a class="dropdown-item" href="#" onclick="exportKeys('json')">JSON格式</a></li>
                        <li><a class="dropdown-item" href="#" onclick="exportKeys('csv')">CSV格式</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 统计卡片 -->
<div class="row mb-4">
    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 2rem;"></i>
                <h5 class="card-title mt-2">有效密钥</h5>
                <h3 class="text-success" id="valid-count">-</h3>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body">
                <i class="bi bi-clock-fill text-warning" style="font-size: 2rem;"></i>
                <h5 class="card-title mt-2">限流密钥</h5>
                <h3 class="text-warning" id="rate-limited-count">-</h3>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body">
                <i class="bi bi-send-fill text-info" style="font-size: 2rem;"></i>
                <h5 class="card-title mt-2">已发送</h5>
                <h3 class="text-info" id="sent-count">-</h3>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body">
                <i class="bi bi-file-earmark-text-fill text-primary" style="font-size: 2rem;"></i>
                <h5 class="card-title mt-2">扫描文件</h5>
                <h3 class="text-primary" id="scanned-count">-</h3>
            </div>
        </div>
    </div>
</div>

<!-- 筛选和搜索 -->
<div class="row mb-4">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3">
                        <label for="key-type" class="form-label">密钥类型</label>
                        <select class="form-select" id="key-type" onchange="loadKeys()">
                            <option value="valid">有效密钥</option>
                            <option value="rate_limited">限流密钥</option>
                            <option value="sent">已发送密钥</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="search-input" class="form-label">搜索密钥</label>
                        <input type="text" class="form-control" id="search-input" placeholder="输入密钥关键词搜索..." onkeyup="handleSearch(event)">
                    </div>
                    <div class="col-md-3">
                        <label for="per-page" class="form-label">每页显示</label>
                        <select class="form-select" id="per-page" onchange="loadKeys()">
                            <option value="25">25条</option>
                            <option value="50" selected>50条</option>
                            <option value="100">100条</option>
                            <option value="200">200条</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 密钥列表 -->
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="bi bi-list-ul"></i> 密钥列表
                    <span class="badge bg-primary ms-2" id="total-badge">0</span>
                </h5>
            </div>
            <div class="card-body">
                <div id="loading-spinner" class="text-center" style="display: none;">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-2">正在加载密钥数据...</p>
                </div>
                
                <div id="keys-container">
                    <!-- 密钥列表将在这里动态加载 -->
                </div>
                
                <!-- 分页 -->
                <nav aria-label="密钥分页" id="pagination-container" style="display: none;">
                    <ul class="pagination justify-content-center" id="pagination">
                        <!-- 分页按钮将在这里动态生成 -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- 密钥详情模态框 -->
<div class="modal fade" id="keyDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-info-circle"></i> 密钥详情
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6">
                        <strong>密钥:</strong>
                        <div class="input-group mt-1">
                            <input type="text" class="form-control" id="modal-key" readonly>
                            <button class="btn btn-outline-secondary" type="button" onclick="copyToClipboard('modal-key')">
                                <i class="bi bi-clipboard"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <strong>状态:</strong>
                        <p class="mt-1"><span id="modal-status" class="badge">-</span></p>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-6">
                        <strong>发现时间:</strong>
                        <p class="mt-1" id="modal-time">-</p>
                    </div>
                    <div class="col-md-6">
                        <strong>来源文件:</strong>
                        <p class="mt-1" id="modal-file">-</p>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12">
                        <strong>来源URL:</strong>
                        <p class="mt-1">
                            <a href="#" id="modal-source" target="_blank" class="text-break">-</a>
                        </p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-primary" onclick="copyToClipboard('modal-key')">
                    <i class="bi bi-clipboard"></i> 复制密钥
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
let currentSearch = '';
let currentType = 'valid';

// 页面加载时初始化
document.addEventListener('DOMContentLoaded', function() {
    loadStatistics();
    loadKeys();
});

// 加载统计信息
function loadStatistics() {
    fetch('/api/keys/statistics')
        .then(response => response.json())
        .then(data => {
            document.getElementById('valid-count').textContent = data.valid_keys || 0;
            document.getElementById('rate-limited-count').textContent = data.rate_limited_keys || 0;
            document.getElementById('sent-count').textContent = data.sent_keys || 0;
            document.getElementById('scanned-count').textContent = data.total_files_scanned || 0;
        })
        .catch(error => {
            console.error('加载统计信息失败:', error);
        });
}

// 加载密钥列表
function loadKeys(page = 1) {
    currentPage = page;
    currentType = document.getElementById('key-type').value;
    currentSearch = document.getElementById('search-input').value;
    const perPage = document.getElementById('per-page').value;
    
    // 显示加载动画
    document.getElementById('loading-spinner').style.display = 'block';
    document.getElementById('keys-container').innerHTML = '';
    document.getElementById('pagination-container').style.display = 'none';
    
    const params = new URLSearchParams({
        type: currentType,
        page: page,
        per_page: perPage,
        search: currentSearch
    });
    
    fetch(`/api/keys?${params}`)
        .then(response => response.json())
        .then(data => {
            displayKeys(data);
            updatePagination(data);
            document.getElementById('total-badge').textContent = data.total || 0;
        })
        .catch(error => {
            console.error('加载密钥失败:', error);
            showAlert('danger', '加载密钥失败: ' + error.message);
        })
        .finally(() => {
            document.getElementById('loading-spinner').style.display = 'none';
        });
}

// 显示密钥列表
function displayKeys(data) {
    const container = document.getElementById('keys-container');
    
    if (!data.keys || data.keys.length === 0) {
        container.innerHTML = `
            <div class="text-center py-5">
                <i class="bi bi-inbox" style="font-size: 3rem; color: #ccc;"></i>
                <h5 class="mt-3 text-muted">暂无密钥数据</h5>
                <p class="text-muted">请等待扫描完成或检查配置</p>
            </div>
        `;
        return;
    }
    
    let html = '<div class="table-responsive"><table class="table table-hover">';
    html += `
        <thead>
            <tr>
                <th>密钥</th>
                <th>状态</th>
                <th>发现时间</th>
                <th>来源</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
    `;
    
    data.keys.forEach(key => {
        const statusClass = getStatusClass(key.status);
        const statusText = getStatusText(key.status);
        const shortKey = key.key.substring(0, 20) + '...';
        const shortSource = key.source ? (key.source.length > 50 ? key.source.substring(0, 50) + '...' : key.source) : '-';
        
        html += `
            <tr>
                <td>
                    <code class="text-primary">${shortKey}</code>
                </td>
                <td>
                    <span class="badge ${statusClass}">${statusText}</span>
                </td>
                <td>
                    <small class="text-muted">${key.found_time || '-'}</small>
                </td>
                <td>
                    <small class="text-muted">${shortSource}</small>
                </td>
                <td>
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="showKeyDetail('${key.key}', '${key.status}', '${key.found_time}', '${key.source}', '${key.file}')">
                        <i class="bi bi-eye"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="copyToClipboard('', '${key.key}')">
                        <i class="bi bi-clipboard"></i>
                    </button>
                </td>
            </tr>
        `;
    });
    
    html += '</tbody></table></div>';
    container.innerHTML = html;
}

// 更新分页
function updatePagination(data) {
    const container = document.getElementById('pagination-container');
    const pagination = document.getElementById('pagination');
    
    if (data.total_pages <= 1) {
        container.style.display = 'none';
        return;
    }
    
    container.style.display = 'block';
    
    let html = '';
    
    // 上一页
    if (data.page > 1) {
        html += `<li class="page-item"><a class="page-link" href="#" onclick="loadKeys(${data.page - 1})">上一页</a></li>`;
    }
    
    // 页码
    const startPage = Math.max(1, data.page - 2);
    const endPage = Math.min(data.total_pages, data.page + 2);
    
    for (let i = startPage; i <= endPage; i++) {
        const activeClass = i === data.page ? 'active' : '';
        html += `<li class="page-item ${activeClass}"><a class="page-link" href="#" onclick="loadKeys(${i})">${i}</a></li>`;
    }
    
    // 下一页
    if (data.page < data.total_pages) {
        html += `<li class="page-item"><a class="page-link" href="#" onclick="loadKeys(${data.page + 1})">下一页</a></li>`;
    }
    
    pagination.innerHTML = html;
}

// 获取状态样式类
function getStatusClass(status) {
    switch (status) {
        case 'active':
        case 'valid':
            return 'bg-success';
        case 'rate_limited':
            return 'bg-warning';
        case 'sent':
            return 'bg-info';
        default:
            return 'bg-secondary';
    }
}

// 获取状态文本
function getStatusText(status) {
    switch (status) {
        case 'active':
        case 'valid':
            return '有效';
        case 'rate_limited':
            return '限流';
        case 'sent':
            return '已发送';
        default:
            return status;
    }
}

// 显示密钥详情
function showKeyDetail(key, status, foundTime, source, file) {
    document.getElementById('modal-key').value = key;
    document.getElementById('modal-status').textContent = getStatusText(status);
    document.getElementById('modal-status').className = `badge ${getStatusClass(status)}`;
    document.getElementById('modal-time').textContent = foundTime || '-';
    document.getElementById('modal-file').textContent = file || '-';
    
    const sourceLink = document.getElementById('modal-source');
    if (source && source !== '-') {
        sourceLink.href = source;
        sourceLink.textContent = source;
    } else {
        sourceLink.href = '#';
        sourceLink.textContent = '-';
    }
    
    new bootstrap.Modal(document.getElementById('keyDetailModal')).show();
}

// 复制到剪贴板
function copyToClipboard(elementId, text = '') {
    const textToCopy = text || document.getElementById(elementId).value;
    
    navigator.clipboard.writeText(textToCopy).then(() => {
        showAlert('success', '已复制到剪贴板');
    }).catch(err => {
        console.error('复制失败:', err);
        showAlert('danger', '复制失败');
    });
}

// 搜索处理
function handleSearch(event) {
    if (event.key === 'Enter') {
        loadKeys(1);
    }
}

// 刷新密钥
function refreshKeys() {
    loadStatistics();
    loadKeys(currentPage);
}

// 导出密钥
function exportKeys(format) {
    const type = document.getElementById('key-type').value;
    const url = `/api/keys/export?type=${type}&format=${format}`;
    
    // 创建下载链接
    const link = document.createElement('a');
    link.href = url;
    link.download = `hajimi_keys_${type}_${new Date().toISOString().split('T')[0]}.${format}`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    showAlert('success', `正在导出${format.toUpperCase()}格式的密钥文件...`);
}

// 显示提示消息
function showAlert(type, message) {
    const alertHtml = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            <i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}"></i>
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    `;
    
    const container = document.querySelector('.container');
    const firstChild = container.firstElementChild;
    const alertDiv = document.createElement('div');
    alertDiv.innerHTML = alertHtml;
    container.insertBefore(alertDiv.firstElementChild, firstChild);
    
    // 5秒后自动隐藏
    setTimeout(() => {
        const alert = document.querySelector('.alert');
        if (alert) {
            const bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        }
    }, 5000);
}
</script>
{% endblock %}
