version: '3.8'

services:
  hajimi-king:
    build: .
    image: hajimi-king:latest
    container_name: hajimi-king
    restart: unless-stopped
    ports:
      - "5000:5000"  # 网页配置界面端口
    # 环境变量
    env_file:
      - .env
    environment:
      # 网页配置相关环境变量
      - WEB_PORT=5000
      - WEB_DEBUG=false
      - WEB_PASSWORD=hajimi123  # 默认密码，建议修改
      - WEB_SECRET_KEY=hajimi-king-web-secret-key-change-me  # 建议修改

    # 数据卷挂载
    volumes:
      - ./data:/app/data
      - ./queries.txt:/app/queries.txt  # 挂载查询配置文件
      - ./.env:/app/.env  # 挂载环境配置文件